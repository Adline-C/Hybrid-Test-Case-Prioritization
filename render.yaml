services:
  # 1. FastAPI Backend Service
  - type: web
    name: hybrid-test-prioritization-api
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: prioritization-db
          property: connectionString

databases:
  # 2. Managed PostgreSQL Database
  - name: prioritization-db
    databaseName: prioritization_db
    user: prioritization_user
    region: singapore