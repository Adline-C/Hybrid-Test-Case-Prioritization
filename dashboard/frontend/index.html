<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid Test Prioritization Dashboard</title>
  <meta name="description" content="Live dashboard for the Hybrid Test Case Prioritization Framework — CI-optimized regression test ranking." />

  <!-- Google Fonts: Inter + JetBrains Mono + Bebas Neue -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Main Styling -->
  <link rel="stylesheet" href="./styles.css" />
