<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid Test Prioritization Dashboard</title>
  <meta name="description" content="Live dashboard for the Hybrid Test Case Prioritization Framework — CI-optimized regression test ranking." />

  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- React & Babel (CDN — no build tool needed) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ── Reset & base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0D0F12;
      --bg2:          #121418;
      --surface:      rgba(255,255,255,0.035);
      --surface2:     rgba(255,255,255,0.06);
      --border:       rgba(255,255,255,0.08);
      --border2:      rgba(255,255,255,0.13);
      --accent:       #FF7A00;
      --accent-dim:   rgba(255,122,0,0.15);
      --accent-glow:  rgba(255,122,0,0.28);
      --amber:        #F97316;
      --green:        #22c55e;
      --red:          #f43f5e;
      --blue:         #60a5fa;
      --purple:       #a78bfa;
      --text:         #F1F5F9;
      --text2:        #94A3B8;
      --muted:        #64748B;
      --font:         'Inter', system-ui, sans-serif;
      --mono:         'JetBrains Mono', monospace;
      --radius:       14px;
      --radius-sm:    8px;
    }

    html { font-size: 15px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      line-height: 1.6;
      /* subtle radial glow from top */
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,122,0,0.07) 0%, transparent 70%);
    }

    /* ── Layout ────────────────────────────────────────────────── */
    .shell { max-width: 1320px; margin: 0 auto; padding: 0 1.5rem 5rem; }

    /* ── Header ────────────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.6rem 0 1.2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
      background: linear-gradient(135deg, #FF7A00 0%, #F97316 60%, #fb923c 100%);
      display: grid; place-items: center; font-size: 1.25rem;
      box-shadow: 0 0 18px rgba(255,122,0,.35);
    }
    .header-text h1 {
      font-size: 1.15rem; font-weight: 700; color: var(--text); letter-spacing: -.01em;
    }
    .header-text p {
      font-size: .72rem; color: var(--muted); margin-top: .1rem; letter-spacing: .02em;
      text-transform: uppercase; font-weight: 500;
    }
    .badge-live {
      margin-left: auto; display: flex; align-items: center; gap: .45rem;
      font-size: .72rem; color: var(--green); font-weight: 600;
      background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.2);
      border-radius: 20px; padding: .25rem .75rem;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(34,197,94,.4); } 50% { opacity:.7; box-shadow:0 0 0 4px rgba(34,197,94,0); } }

    /* ── Glass Card ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .card-header {
      padding: .9rem 1.3rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .card-title { font-size: .88rem; font-weight: 600; color: var(--text); }
    .card-meta  { font-size: .72rem; color: var(--muted); }

    /* ── Analyze Form ──────────────────────────────────────────── */
    .analyze-bar {
      display: flex; gap: .8rem; flex-wrap: wrap; align-items: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.1rem 1.3rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(12px);
    }
    .analyze-bar label {
      display: block; font-size: .7rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: .35rem;
    }
    .analyze-input {
      width: 100%; background: rgba(255,255,255,.04);
      border: 1px solid var(--border2); border-radius: var(--radius-sm);
      padding: .5rem .9rem; color: var(--text); font-size: .82rem;
      font-family: var(--mono); outline: none; transition: border-color .15s;
    }
    .analyze-input:focus { border-color: var(--accent); }
    .analyze-input::placeholder { color: var(--muted); }
    .btn-analyze {
      padding: .52rem 1.5rem; border-radius: var(--radius-sm); border: none;
      background: linear-gradient(135deg, #FF7A00, #F97316);
      color: #fff; font-weight: 700; font-size: .82rem; font-family: var(--font);
      cursor: pointer; white-space: nowrap; transition: all .18s;
      box-shadow: 0 0 16px rgba(255,122,0,.3);
    }
    .btn-analyze:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 22px rgba(255,122,0,.45); }
    .btn-analyze:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Weight Tuning Control Bar ─────────────────────────────── */
    .weight-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.1rem 1.3rem;
      margin-bottom: 1.5rem; backdrop-filter: blur(12px);
    }
    .weight-bar-title {
      font-size: .7rem; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: .07em; margin-bottom: .9rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .weight-bar-title::before { content: '⚖️'; font-size: .85rem; }
    .weight-controls { display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-end; }
    .weight-control { flex: 1; min-width: 200px; }
    .weight-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .75rem; font-weight: 600; color: var(--text2); margin-bottom: .45rem;
    }
    .weight-label span:last-child {
      font-family: var(--mono); color: var(--accent); font-size: .8rem; font-weight: 700;
      background: var(--accent-dim); padding: .1rem .45rem; border-radius: 5px;
    }
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 5px;
      background: rgba(255,255,255,.1); border-radius: 5px; outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px rgba(255,122,0,.5);
      cursor: pointer; transition: transform .12s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .formula-badge {
      align-self: flex-end; margin-left: auto;
      background: var(--accent-dim); border: 1px solid rgba(255,122,0,.25);
      border-radius: var(--radius-sm); padding: .4rem .8rem;
      font-size: .72rem; font-family: var(--mono); color: var(--accent);
      white-space: nowrap; font-weight: 500;
    }

    /* ── Tabs ──────────────────────────────────────────────────── */
    .tabs { display: flex; gap: .3rem; margin-bottom: 1.5rem; }
    .tab {
      padding: .45rem 1.1rem; border-radius: var(--radius-sm); border: 1px solid transparent;
      cursor: pointer; font-size: .83rem; font-weight: 500;
      background: none; color: var(--muted); font-family: var(--font); transition: all .15s;
    }
    .tab:hover   { color: var(--text); background: var(--surface2); }
    .tab.active  {
      color: var(--accent); background: var(--accent-dim);
      border-color: rgba(255,122,0,.3);
    }

    /* ── Stats bar ─────────────────────────────────────────────── */
    .stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat {
      flex: 1; min-width: 130px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .9rem 1.1rem;
      backdrop-filter: blur(8px); position: relative; overflow: hidden;
    }
    .stat::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      border-radius: 2px 2px 0 0;
    }
    .stat.c-accent::before { background: var(--accent); }
    .stat.c-red::before    { background: var(--red); }
    .stat.c-amber::before  { background: var(--amber); }
    .stat.c-green::before  { background: var(--green); }
    .stat-val { font-size: 1.8rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: .7rem; color: var(--muted); margin-top: .25rem; font-weight: 500; letter-spacing: .01em; }
    .c-accent .stat-val { color: var(--accent); }
    .c-red    .stat-val { color: var(--red);    }
    .c-amber  .stat-val { color: var(--amber);  }
    .c-green  .stat-val { color: var(--green);  }

    /* ── Changed files pills ───────────────────────────────────── */
    .pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.5rem; }
    .pill {
      font-size: .7rem; font-family: var(--mono); padding: .22rem .65rem;
      border-radius: 20px; border: 1px solid var(--border2);
      background: rgba(255,122,0,.07); color: var(--amber);
    }

    /* ── Table ─────────────────────────────────────────────────── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th {
      text-align: left; padding: .65rem 1.1rem;
      color: var(--muted); font-weight: 600; font-size: .68rem;
      text-transform: uppercase; letter-spacing: .06em;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(13,15,18,.95); z-index: 1;
      backdrop-filter: blur(8px);
    }
    td { padding: .65rem 1.1rem; border-bottom: 1px solid var(--border); transition: background .1s; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* Row heat: left accent bar */
    .row-high td:first-child { border-left: 3px solid var(--red);   padding-left: .85rem; }
    .row-mid  td:first-child { border-left: 3px solid var(--amber); padding-left: .85rem; }
    .row-low  td:first-child { border-left: 3px solid var(--border);padding-left: .85rem; }

    .test-name {
      font-family: var(--mono); font-size: .77rem;
      color: var(--text); word-break: break-all;
    }
    .test-module { font-size: .67rem; color: var(--muted); margin-top: .1rem; }

    /* Score chip */
    .score-chip {
      display: inline-block; padding: .15rem .6rem;
      border-radius: 20px; font-weight: 700; font-size: .73rem;
      font-family: var(--mono);
    }
    .score-chip.high  { background: rgba(244,63,94,.15);  color: var(--red);   border: 1px solid rgba(244,63,94,.25); }
    .score-chip.mid   { background: rgba(249,115,22,.15); color: var(--amber); border: 1px solid rgba(249,115,22,.25); }
    .score-chip.low   { background: var(--surface2);      color: var(--muted); border: 1px solid var(--border); }

    /* Badge yes/no pills */
    .badge-yes {
      display: inline-block; font-size: .7rem; font-weight: 700; padding: .15rem .55rem;
      border-radius: 20px; background: rgba(244,63,94,.12); color: var(--red);
      border: 1px solid rgba(244,63,94,.25);
    }
    .badge-no {
      display: inline-block; font-size: .7rem; color: var(--muted);
      padding: .15rem .55rem; border-radius: 20px; border: 1px solid var(--border);
    }

    /* History dots */
    .history-dots { display: flex; gap: 3px; align-items: center; }
    .dot-pass { width:8px; height:8px; border-radius:50%; background: var(--green); box-shadow: 0 0 5px rgba(34,197,94,.5); }
    .dot-fail { width:8px; height:8px; border-radius:50%; background: var(--red);   box-shadow: 0 0 5px rgba(244,63,94,.5); }

    /* ── Comparison view ───────────────────────────────────────── */
    .cmp-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 680px) { .cmp-grid { grid-template-columns: 1fr; } }
    .cmp-col-hdr {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); margin-bottom: .5rem; padding: 0 .2rem;
    }
    .cmp-item {
      padding: .4rem .75rem; border-radius: var(--radius-sm); font-size: .78rem;
      font-family: var(--mono); display: flex; gap: .6rem; align-items: center;
      margin-bottom: .25rem; background: var(--surface2);
      border: 1px solid var(--border);
      transition: background .1s;
    }
    .cmp-item:hover { background: rgba(255,255,255,.08); }
    .cmp-num { color: var(--muted); min-width: 1.6rem; font-weight: 600; }
    .cmp-moved-pos { color: var(--green); font-size: .7rem; font-weight: 700; }
    .cmp-moved-neg { color: var(--red);   font-size: .7rem; font-weight: 700; }

    /* ── Loading / error ───────────────────────────────────────── */
    .state-box {
      text-align: center; padding: 4rem 1rem; color: var(--muted);
    }
    .state-box .icon { font-size: 2.5rem; margin-bottom: .8rem; }
    .state-box p { font-size: .9rem; max-width: 420px; margin: 0 auto; }
    .state-box small {
      display: block; margin-top: .4rem; font-size: .75rem;
      font-family: var(--mono); color: var(--border);
    }

    /* ── Refresh button ────────────────────────────────────────── */
    .btn-refresh {
      padding: .38rem .9rem; border-radius: var(--radius-sm); border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text2); cursor: pointer;
      font-size: .78rem; font-family: var(--font); transition: all .15s;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Analyzing spinner ─────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.2); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: .4rem;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Config ───────────────────────────────────────────────────────────────────
const API_BASE = "http://localhost:8001";
const REFRESH_INTERVAL_MS = 30_000;

// ── Helpers ──────────────────────────────────────────────────────────────────
function scoreClass(score) {
  if (score >= 2) return "high";
  if (score >= 0.5) return "mid";
  return "low";
}
function rowClass(score) {
  if (score >= 2) return "row-high";
  if (score >= 0.5) return "row-mid";
  return "row-low";
}
function shortName(name) {
  return name.replace(/^.*::/, "");
}

// ── HistoryDots ───────────────────────────────────────────────────────────────
function HistoryDots({ history }) {
  if (!history || history.length === 0)
    return <span className="badge-no">—</span>;
  return (
    <span className="history-dots" title={history.map(h => h ? "P" : "F").join(" ")}>
      {history.slice(-5).map((h, i) => (
        <span key={i} className={h ? "dot-pass" : "dot-fail"} />
      ))}
    </span>
  );
}

// ── RankingTable ──────────────────────────────────────────────────────────────
function RankingTable({ tests, changedFiles, wc, wh }) {
  const high   = tests.filter(t => t.score >= wc).length;
  const mid    = tests.filter(t => t.score > 0 && t.score < wc).length;
  const atRisk = tests.filter(t => t.overlap).length;

  return (
    <>
      {/* Stats bar */}
      <div className="stats">
        <div className="stat c-accent">
          <div className="stat-val">{tests.length}</div>
          <div className="stat-lbl">Total Tests</div>
        </div>
        <div className="stat c-red">
          <div className="stat-val">{high}</div>
          <div className="stat-lbl">High Priority (Score: {wc}/{wc})</div>
        </div>
        <div className="stat c-amber">
          <div className="stat-val">{mid}</div>
          <div className="stat-lbl">Medium Priority</div>
        </div>
        <div className="stat c-green">
          <div className="stat-val">{atRisk}</div>
          <div className="stat-lbl">Touch Changed Code</div>
        </div>
      </div>

      {/* Changed files */}
      {changedFiles && changedFiles.length > 0 && (
        <>
          <p style={{fontSize:'.72rem', color:'var(--muted)', marginBottom:'.5rem', fontWeight:'600', textTransform:'uppercase', letterSpacing:'.05em'}}>
            Files changed in latest commit:
          </p>
          <div className="pills">
            {changedFiles.map(f => <span key={f} className="pill">{f}</span>)}
          </div>
        </>
      )}

      {/* Table */}
      <div className="card">
        <div className="card-header">
          <span className="card-title">Prioritized Test Order</span>
          <span className="card-meta">Sorted by score — highest risk first</span>
        </div>
        <div className="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th style={{width:'52px'}}>#</th>
                <th>Test Name</th>
                <th>Score</th>
                <th>Changed File?</th>
                <th>Recent Fails</th>
                <th>Last 5 Runs</th>
              </tr>
            </thead>
            <tbody>
              {tests.map(t => (
                <tr key={t.name} className={rowClass(t.score)}>
                  <td style={{color:'var(--muted)', fontFamily:'var(--mono)', fontWeight:'600'}}>{t.rank}</td>
                  <td>
                    <span className="test-name" title={t.name}>{shortName(t.name)}</span>
                    <div className="test-module">{t.name.split('::')[0]}</div>
                  </td>
                  <td>
                    <span className={`score-chip ${scoreClass(t.score)}`}>{t.score}</span>
                  </td>
                  <td>
                    {t.overlap
                      ? <span className="badge-yes">✓ YES</span>
                      : <span className="badge-no">no</span>}
                  </td>
                  <td style={{color: t.failures_in_last_5 > 0 ? 'var(--red)' : 'var(--muted)', fontFamily:'var(--mono)', fontWeight:'600'}}>
                    {t.failures_in_last_5}
                  </td>
                  <td><HistoryDots history={t.history} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

// ── ComparisonView ────────────────────────────────────────────────────────────
function ComparisonView({ data }) {
  if (!data) return null;
  const { before, after, detail } = data;
  const detailMap = {};
  detail.forEach(d => { detailMap[d.name] = d; });

  return (
    <>
      <div className="card" style={{marginBottom:'1.5rem'}}>
        <div className="card-header">
          <span className="card-title">Before vs. After Prioritization</span>
          <span className="card-meta">How many positions each test moved when the engine ran</span>
        </div>
        <div style={{padding:'1.2rem'}}>
          <div className="cmp-grid">
            {/* BEFORE */}
            <div>
              <div className="cmp-col-hdr">🔵 Before (alphabetical / default pytest)</div>
              {before.map((name, i) => (
                <div key={name} className="cmp-item">
                  <span className="cmp-num">{i+1}</span>
                  <span style={{flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}} title={name}>{shortName(name)}</span>
                </div>
              ))}
            </div>

            {/* AFTER */}
            <div>
              <div className="cmp-col-hdr">🟠 After (prioritized by engine)</div>
              {after.map((name, i) => {
                const d = detailMap[name];
                const moved = d ? d.moved_by : 0;
                return (
                  <div key={name} className="cmp-item">
                    <span className="cmp-num">{i+1}</span>
                    <span style={{flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}} title={name}>{shortName(name)}</span>
                    {moved > 0 && <span className="cmp-moved-pos">▲{moved}</span>}
                    {moved < 0 && <span className="cmp-moved-neg">▼{Math.abs(moved)}</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>

      {/* Movement detail table */}
      <div className="card">
        <div className="card-header">
          <span className="card-title">Movement Detail</span>
          <span className="card-meta">Positive = test was promoted (runs earlier)</span>
        </div>
        <div className="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Test</th>
                <th>Before Rank</th>
                <th>After Rank</th>
                <th>Score</th>
                <th>Moved By</th>
              </tr>
            </thead>
            <tbody>
              {detail
                .slice()
                .sort((a,b) => Math.abs(b.moved_by) - Math.abs(a.moved_by))
                .map(d => (
                  <tr key={d.name}>
                    <td><span className="test-name" title={d.name}>{shortName(d.name)}</span></td>
                    <td style={{color:'var(--muted)', fontFamily:'var(--mono)'}}>{d.before_rank}</td>
                    <td style={{fontFamily:'var(--mono)'}}>{d.after_rank}</td>
                    <td>
                      <span className={`score-chip ${scoreClass(d.score)}`}>{d.score}</span>
                    </td>
                    <td>
                      {d.moved_by > 0 && <span className="cmp-moved-pos">▲ {d.moved_by}</span>}
                      {d.moved_by < 0 && <span className="cmp-moved-neg">▼ {Math.abs(d.moved_by)}</span>}
                      {d.moved_by === 0 && <span style={{color:'var(--muted)'}}>—</span>}
                    </td>
                  </tr>
                ))}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]           = useState("ranking");
  const [ranking, setRanking]   = useState(null);
  const [comparison, setComparison] = useState(null);
  const [loading, setLoading]   = useState(true);
  const [error, setError]       = useState(null);
  const [lastRefresh, setLastRefresh] = useState(null);

  // Analyze feature
  const [repoUrl, setRepoUrl]   = useState("");
  const [isCustomRepo, setIsCustomRepo] = useState(false);
  const [analyzing, setAnalyzing] = useState(false);

  // Dynamic weight state
  const [wc, setWc] = useState(2.0);
  const [wh, setWh] = useState(1.0);

  // Debounce timer ref for slider changes
  const weightTimer = useRef(null);

  // ── fetchAll ───────────────────────────────────────────────────
  const fetchAll = useCallback(async (wcVal, whVal) => {
    const wcp = wcVal !== undefined ? wcVal : wc;
    const whp = whVal !== undefined ? whVal : wh;
    setLoading(true);
    setError(null);
    try {
      const [rRes, cRes] = await Promise.all([
        fetch(`${API_BASE}/api/ranking?w_c=${wcp}&w_h=${whp}`),
        fetch(`${API_BASE}/api/comparison?w_c=${wcp}&w_h=${whp}`),
      ]);
      if (!rRes.ok || !cRes.ok) throw new Error("API returned an error response");
      const [rData, cData] = await Promise.all([rRes.json(), cRes.json()]);
      setRanking(rData);
      setComparison(cData);
      setLastRefresh(new Date().toLocaleTimeString());
      setIsCustomRepo(false);
    } catch (e) {
      setError(e.message || "Could not reach the API");
    } finally {
      setLoading(false);
    }
  }, [wc, wh]);

  // ── Slider handlers (debounced refetch) ────────────────────────
  const handleWcChange = (newVal) => {
    setWc(newVal);
    if (!isCustomRepo) {
      clearTimeout(weightTimer.current);
      weightTimer.current = setTimeout(() => fetchAll(newVal, wh), 600);
    }
  };
  const handleWhChange = (newVal) => {
    setWh(newVal);
    if (!isCustomRepo) {
      clearTimeout(weightTimer.current);
      weightTimer.current = setTimeout(() => fetchAll(wc, newVal), 600);
    }
  };

  // ── handleAnalyze ──────────────────────────────────────────────
  const handleAnalyze = async () => {
    if (repoUrl && repoUrl.trim()) {
      const url = repoUrl.trim();
      setAnalyzing(true);
      setError(null);
      // Immediately clear old tables
      setRanking(null);
      setComparison(null);
      try {
        const res = await fetch(`${API_BASE}/api/analyze?w_c=${wc}&w_h=${wh}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_url: url })
        });
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.detail || "Analysis failed");
        }
        const data = await res.json();
        setRanking(data);
        setIsCustomRepo(true);

        // Build comparison from returned data
        const beforeList = [...data.tests].sort((a,b) => a.name.localeCompare(b.name)).map(t => t.name);
        const afterList  = data.tests.map(t => t.name);
        const beforePos  = {}; beforeList.forEach((n, i) => { beforePos[n] = i + 1; });
        const afterPos   = {}; afterList.forEach((n, i)  => { afterPos[n]  = i + 1; });

        const comparisonDetail = beforeList.map(name => {
          const t = data.tests.find(x => x.name === name);
          return {
            name,
            before_rank: beforePos[name],
            after_rank:  afterPos[name],
            score:       t ? t.score : 0,
            moved_by:    beforePos[name] - afterPos[name]
          };
        });

        setComparison({ before: beforeList, after: afterList, detail: comparisonDetail });
        setLastRefresh("Repo: " + url.split("/").slice(-1)[0]);
      } catch (e) {
        setError(e.message);
        setIsCustomRepo(false);
        fetchAll();
      } finally {
        setAnalyzing(false);
      }
    }
  };

  // ── Mount + periodic refresh ───────────────────────────────────
  useEffect(() => { fetchAll(); }, []); // eslint-disable-line
  useEffect(() => {
    const timer = setInterval(() => {
      if (!isCustomRepo && !analyzing) fetchAll();
    }, REFRESH_INTERVAL_MS);
    return () => clearInterval(timer);
  }, [isCustomRepo, analyzing]); // eslint-disable-line

  // ── Render ─────────────────────────────────────────────────────
  return (
    <div className="shell">
      {/* ── Header ── */}
      <header className="header">
        <div className="logo">⚡</div>
        <div className="header-text">
          <h1>Hybrid Test Prioritization Dashboard</h1>
          <p>Continuous Integration Test Optimization Engine</p>
        </div>
        <div className="badge-live">
          <span className="dot" />
          {lastRefresh ? `Updated ${lastRefresh}` : "Connecting…"}
        </div>
      </header>

      {/* ── Repository Analysis Form ── */}
      <div className="analyze-bar">
        <div style={{flex:'1', minWidth:'260px'}}>
          <label>Analyze Public GitHub Repository</label>
          <input
            className="analyze-input"
            type="text"
            placeholder="e.g., https://github.com/username/repository"
            value={repoUrl}
            onChange={(e) => {
              // ONLY updates raw input string — does not reset table state
              setRepoUrl(e.target.value);
            }}
            disabled={analyzing}
          />
        </div>
        <button
          className="btn-analyze"
          onClick={handleAnalyze}
          disabled={analyzing || !repoUrl.trim()}
        >
          {analyzing ? <><span className="spinner"/>{" "}Analyzing…</> : "Analyze →"}
        </button>
      </div>

      {/* ── Dynamic Weight Tuning Bar ── */}
      <div className="weight-bar">
        <div className="weight-bar-title">Dynamic Weight Tuning Module</div>
        <div className="weight-controls">
          <div className="weight-control">
            <div className="weight-label">
              <span>Change Impact Weight (w_c)</span>
              <span>{wc.toFixed(1)}</span>
            </div>
            <input
              type="range"
              min="0" max="5" step="0.5"
              value={wc}
              onChange={(e) => handleWcChange(parseFloat(e.target.value))}
            />
          </div>
          <div className="weight-control">
            <div className="weight-label">
              <span>Failure Recency Weight (w_h)</span>
              <span>{wh.toFixed(1)}</span>
            </div>
            <input
              type="range"
              min="0" max="5" step="0.5"
              value={wh}
              onChange={(e) => handleWhChange(parseFloat(e.target.value))}
            />
          </div>
          <div className="formula-badge">
            Active Weighting: {wc.toFixed(1)} × Change + {wh.toFixed(1)} × Recency
          </div>
        </div>
      </div>

      {/* ── Analyzing overlay ── */}
      {analyzing && (
        <div className="state-box" style={{marginBottom:'1.5rem'}}>
          <div className="icon">⚙️</div>
          <p>Cloning repository, installing dependencies, and running test suite…<br />
            <small>This may take up to 5 minutes for large frameworks.</small>
          </p>
        </div>
      )}

      {/* ── Tabs ── */}
      <div className="tabs">
        <button id="tab-ranking" className={`tab ${tab==="ranking"?"active":""}`} onClick={() => setTab("ranking")}>
          📊 Ranked View
        </button>
        <button id="tab-comparison" className={`tab ${tab==="comparison"?"active":""}`} onClick={() => setTab("comparison")}>
          🔀 Before / After
        </button>
      </div>

      {/* ── Refresh row ── */}
      <div style={{display:'flex', justifyContent:'flex-end', marginBottom:'1rem'}}>
        <button className="btn-refresh" onClick={isCustomRepo ? handleAnalyze : () => fetchAll()} id="btn-refresh">
          ↻ Refresh now
        </button>
      </div>

      {/* ── States ── */}
      {loading && !analyzing && (
        <div className="state-box">
          <div className="icon">⏳</div>
          <p>Loading ranking data from the API…</p>
          <small>{API_BASE}</small>
        </div>
      )}

      {!loading && error && !analyzing && (
        <div className="state-box">
          <div className="icon">🔌</div>
          <p>Error in Analysis or API Server Connection.</p>
          <small>Verify API server state or your repository URL details.</small>
          <small style={{marginTop:'.6rem', color:'var(--red)'}}>{error}</small>
        </div>
      )}

      {!loading && !error && ranking && !analyzing && (
        <>
          {tab === "ranking" && (
            <RankingTable
              tests={ranking.tests}
              changedFiles={ranking.changed_files}
              wc={wc}
              wh={wh}
            />
          )}
          {tab === "comparison" && comparison && (
            <ComparisonView data={comparison} />
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
